<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эпичный Рандомайзер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0c0c2e, #1a1a4a, #2d2d6e);
            color: white;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            text-align: center;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.3);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        input {
            padding: 12px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            text-align: center;
            width: 120px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.8);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            font-size: 4em;
            font-weight: bold;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 20px #ff00ff, 0 0 30px #ff00ff;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.5s;
        }

        .animation-container {
            position: relative;
            margin: 20px 0;
        }

        .pulse {
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .fireworks {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            animation: explode 1s forwards;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty));
                opacity: 0;
            }
        }

        .stop-btn {
            background: linear-gradient(45deg, #ff4444, #ffaa00);
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎲 ЭПИЧНЫЙ РАНДОМАЙЗЕР 🎲</h1>
        
        <div class="input-group">
            <input type="number" id="min" placeholder="От" value="1">
            <span style="font-size: 24px; align-self: center;">-</span>
            <input type="number" id="max" placeholder="До" value="100">

            <div class="result" id="result">?</div>

        </div>
    </div>

    <div class="stars" id="stars"></div>
    
    <div class="container">
        <h1>🎲 ЭПИЧНЫЙ РАНДОМАЙЗЕР 🎲</h1>
        
        <div class="input-group">
            <input type="number" id="min" placeholder="От" value="1">

            <input type="number" id="max" placeholder="До" value="100">
        </div>

        <button id="stopBtn" class="stop-btn" onclick="stopSounds()">🔇 ОСТАНОВИТЬ ЗВУКИ</button>
        
        <div class="animation-container">
            <div class="result" id="result">?</div>
            <div class="fireworks" id="fireworks"></div>
        </div>
    </div>

    <script>
        // Создаем звезды на фоне
        function createStars() {
            const stars = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                stars.appendChild(star);
            }
        }

        let audioContext;
        let oscillators = [];
        let isPlaying = false;

        // Создаем случайный звук
        function createRandomSound() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            // Случайные параметры звука
            oscillator.type = ['sine', 'square', 'sawtooth', 'triangle'][Math.floor(Math.random() * 4)];
            oscillator.frequency.value = 100 + Math.random() * 2000;
            
            gainNode.gain.value = 0.3 + Math.random() * 0.7;
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.start();
            oscillators.push(oscillator);
            
            // Автоматически останавливаем звук через случайное время
            setTimeout(() => {
                if (oscillator) {
                    oscillator.stop();
                    const index = oscillators.indexOf(oscillator);
                    if (index > -1) {
                        oscillators.splice(index, 1);
                    }
                }
            }, 500 + Math.random() * 1500);
        }

        // Запуск бесконечных звуков
        function startInfiniteSounds() {
            if (!isPlaying) return;
            
            createRandomSound();
            // Случайный интервал между звуками для хаотичности
            setTimeout(startInfiniteSounds, 50 + Math.random() * 200);
        }

        // Остановка всех звуков
        function stopSounds() {
            isPlaying = false;
            oscillators.forEach(osc => {
                try {
                    osc.stop();
                } catch(e) {}
            });
            oscillators = [];
            document.getElementById('stopBtn').style.display = 'none';
        }

        // Создаем фейерверк
        function createFireworks() {
            const fireworks = document.getElementById('fireworks');
            fireworks.innerHTML = '';
            
            for (let i = 0; i < 50; i++) {
                const firework = document.createElement('div');
                firework.className = 'firework';
                firework.style.left = '50%';
                firework.style.top = '50%';
                firework.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 50 + Math.random() * 100;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                firework.style.setProperty('--tx', tx + 'px');
                firework.style.setProperty('--ty', ty + 'px');
                
                fireworks.appendChild(firework);
                
                // Удаляем элемент после анимации
                setTimeout(() => {
                    if (firework.parentNode) {
                        firework.parentNode.removeChild(firework);
                    }
                }, 1000);
            }
        }

        // Главная функция анимации
        function startAnimation() {
            const min = parseInt(document.getElementById('min').value) || 1;
            const max = parseInt(document.getElementById('max').value) || 100;
            const resultElement = document.getElementById('result');
            const generateBtn = document.getElementById('generateBtn');
            const stopBtn = document.getElementById('stopBtn');
            
            if (min >= max) {
                alert('Введите корректный диапазон!');
                return;
            }

            // Блокируем кнопку на время анимации
            generateBtn.disabled = true;
            
            // Запускаем анимацию счетчика
            let counter = 0;
            const duration = 3000; // 3 секунды анимации
            const startTime = Date.now();
            const finalNumber = Math.floor(Math.random() * (max - min + 1)) + min;
            
            function updateCounter() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Нелинейная анимация - начинаем быстро, замедляемся в конце
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                if (progress < 1) {
                    // Показываем "прокрутку" чисел
                    const currentNumber = Math.floor(min + (finalNumber - min) * easeOut);
                    resultElement.textContent = currentNumber;
                    resultElement.classList.add('pulse');
                    
                    // Создаем случайные звуки во время анимации
                    if (Math.random() < 0.3) {
                        createRandomSound();
                    }
                    
                    requestAnimationFrame(updateCounter);
                } else {
                    // Финальное число
                    resultElement.textContent = finalNumber;
                    resultElement.classList.remove('pulse');
                    
                    // Запускаем фейерверк
                    createFireworks();
                    
                    // Запускаем бесконечные громкие звуки
                    isPlaying = true;
                    startInfiniteSounds();
                    
                    // Показываем кнопку остановки
                    stopBtn.style.display = 'block';
                    
                    // Разблокируем кнопку
                    generateBtn.disabled = false;
                }
            }
            
            updateCounter();
        }

        // Инициализация при загрузке
        window.onload = function() {
            createStars();
        };
    </script>
