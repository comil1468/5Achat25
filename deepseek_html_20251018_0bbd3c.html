<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5A Messenger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #f0f2f5;
            --chat-bg: #ffffff;
            --text-color: #333333;
            --message-user: #0084ff;
            --message-other: #e4e6eb;
            --button-color: #1877f2;
            --border-color: #dddfe2;
            --accent-color: #ff6b6b;
        }

        .dark-theme {
            --bg-color: #18191a;
            --chat-bg: #242526;
            --text-color: #e4e6eb;
            --message-user: #0084ff;
            --message-other: #3e4042;
            --button-color: #1877f2;
            --border-color: #3e4042;
            --accent-color: #ff6b6b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            transition: all 0.3s ease;
        }

        /* Страница авторизации */
        .auth-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, var(--accent-color), var(--button-color));
        }

        .auth-box {
            background-color: var(--chat-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            font-size: 3em;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .logo-subtitle {
            font-size: 1.2em;
            opacity: 0.8;
            margin-bottom: 30px;
            color: var(--text-color);
        }

        #username-input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--chat-bg);
            color: var(--text-color);
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
        }

        #login-button {
            width: 100%;
            padding: 15px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Основной интерфейс */
        .chat-interface {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background-color: var(--chat-bg);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-small {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--accent-color);
        }

        .current-user {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--message-user);
            color: white;
        }

        .other-message {
            align-self: flex-start;
            background-color: var(--message-other);
            color: var(--text-color);
        }

        .message-sender {
            font-size: 0.8em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .message-time {
            font-size: 0.7em;
            opacity: 0.6;
            text-align: right;
            margin-top: 5px;
        }

        .media-content {
            max-width: 300px;
            max-height: 300px;
            margin-top: 5px;
            border-radius: 10px;
            cursor: pointer;
        }

        .input-area {
            display: flex;
            padding: 15px 20px;
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            gap: 10px;
        }

        #message-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            background-color: var(--chat-bg);
            color: var(--text-color);
            font-size: 16px;
        }

        #file-input {
            display: none;
        }

        .file-button, #send-button {
            background-color: var(--button-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .settings-panel {
            position: fixed;
            top: 0;
            right: -300px;
            width: 280px;
            height: 100%;
            background-color: var(--chat-bg);
            padding: 20px;
            transition: right 0.3s ease;
            z-index: 1000;
        }

        .settings-panel.open {
            right: 0;
        }

        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }

        .settings-overlay.active {
            display: block;
        }

        .theme-option {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            background-color: var(--bg-color);
        }

        .theme-preview {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid var(--border-color);
        }

        .light-preview {
            background: linear-gradient(135deg, #ffffff 50%, #f0f2f5 50%);
        }

        .dark-preview {
            background: linear-gradient(135deg, #242526 50%, #18191a 50%);
        }

        .logout-button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 0.9em;
            opacity: 0.7;
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border-color);
        }

        .footer a {
            color: var(--text-color);
            text-decoration: none;
        }

        #settings-button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
        }

        .media-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .media-fullscreen img,
        .media-fullscreen video {
            max-width: 90%;
            max-height: 90%;
        }

        .close-fullscreen {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 30px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .error-message {
            color: red;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Страница авторизации -->
    <div class="auth-container" id="auth-container">
        <div class="auth-box">
            <div class="logo">5A</div>
            <div class="logo-subtitle">Быстрый мессенджер</div>
            <input type="text" id="username-input" placeholder="Введите ваш никнейм" maxlength="20">
            <div class="error-message" id="login-error">Введите никнейм</div>
            <button id="login-button">Войти в чат</button>
        </div>
    </div>

    <!-- Основной интерфейс чата -->
    <div class="chat-interface" id="chat-interface">
        <div class="header">
            <div class="header-logo">
                <div class="logo-small">5A</div>
                <div class="current-user" id="current-user"></div>
            </div>
            <button id="settings-button">⚙️</button>
        </div>

        <div class="chat-container" id="chat-container"></div>

        <div class="input-area">
            <input type="text" id="message-input" placeholder="Введите сообщение...">
            <button class="file-button" onclick="document.getElementById('file-input').click()">📎</button>
            <input type="file" id="file-input" accept="image/*,video/*">
            <button id="send-button">➤</button>
        </div>

        <div class="media-fullscreen" id="media-fullscreen">
            <button class="close-fullscreen" onclick="closeFullscreen()">×</button>
        </div>

        <div class="settings-overlay" id="settings-overlay"></div>
        <div class="settings-panel" id="settings-panel">
            <h2>Настройки</h2>
            
            <h3>Цветовая тема</h3>
            <div class="theme-option" data-theme="light">
                <div class="theme-preview light-preview"></div>
                <span>Светлая тема</span>
            </div>
            <div class="theme-option" data-theme="dark">
                <div class="theme-preview dark-preview"></div>
                <span>Тёмная тема</span>
            </div>
            
            <button class="logout-button" onclick="logout()">Выйти из аккаунта</button>
            
            <div class="footer">
                by kamorka game<br>
                <a href="https://vk.com/club230489659?from=groups" target="_blank">VK группа</a>
            </div>
        </div>
    </div>

    <script>
        // Простая и надежная инициализация
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Страница загружена');
            initializeApp();
        });

        function initializeApp() {
            // Проверяем сохраненные данные
            const savedUsername = localStorage.getItem('5a_username');
            const savedTheme = localStorage.getItem('5a_theme') || 'light';
            
            // Устанавливаем тему
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
            }
            
            // Проверяем авторизацию
            if (savedUsername && savedUsername.trim() !== '') {
                showChatInterface(savedUsername);
            } else {
                showAuthInterface();
            }
            
            setupEventListeners();
        }

        function setupEventListeners() {
            // Авторизация
            document.getElementById('login-button').addEventListener('click', handleLogin);
            document.getElementById('username-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleLogin();
            });
            
            // Чат
            document.getElementById('send-button').addEventListener('click', sendMessage);
            document.getElementById('message-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') sendMessage();
            });
            
            // Файлы
            document.getElementById('file-input').addEventListener('change', handleFileUpload);
            
            // Настройки
            document.getElementById('settings-button').addEventListener('click', function() {
                document.getElementById('settings-panel').classList.add('open');
                document.getElementById('settings-overlay').classList.add('active');
            });
            
            document.getElementById('settings-overlay').addEventListener('click', function() {
                document.getElementById('settings-panel').classList.remove('open');
                this.classList.remove('active');
            });
            
            // Темы
            document.querySelectorAll('.theme-option').forEach(option => {
                option.addEventListener('click', function() {
                    const theme = this.getAttribute('data-theme');
                    setTheme(theme);
                });
            });
        }

        function handleLogin() {
            const usernameInput = document.getElementById('username-input');
            const username = usernameInput.value.trim();
            const errorElement = document.getElementById('login-error');
            
            if (!username) {
                errorElement.style.display = 'block';
                return;
            }
            
            errorElement.style.display = 'none';
            localStorage.setItem('5a_username', username);
            showChatInterface(username);
        }

        function showAuthInterface() {
            document.getElementById('auth-container').style.display = 'flex';
            document.getElementById('chat-interface').style.display = 'none';
        }

        function showChatInterface(username) {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('chat-interface').style.display = 'flex';
            document.getElementById('current-user').textContent = username;
            loadMessages();
        }

        function logout() {
            if (confirm('Вы уверены, что хотите выйти?')) {
                localStorage.removeItem('5a_username');
                showAuthInterface();
                closeSettings();
            }
        }

        function closeSettings() {
            document.getElementById('settings-panel').classList.remove('open');
            document.getElementById('settings-overlay').classList.remove('active');
        }

        function setTheme(theme) {
            document.body.classList.toggle('dark-theme', theme === 'dark');
            localStorage.setItem('5a_theme', theme);
        }

        function loadMessages() {
            try {
                const messages = JSON.parse(localStorage.getItem('5a_messages') || '[]');
                const chatContainer = document.getElementById('chat-container');
                chatContainer.innerHTML = '';
                
                messages.forEach(msg => {
                    addMessageToChat(msg, false);
                });
            } catch (error) {
                console.error('Ошибка загрузки сообщений:', error);
                localStorage.setItem('5a_messages', '[]');
            }
        }

        function saveMessage(messageData) {
            try {
                const messages = JSON.parse(localStorage.getItem('5a_messages') || '[]');
                messages.push(messageData);
                localStorage.setItem('5a_messages', JSON.stringify(messages));
            } catch (error) {
                console.error('Ошибка сохранения сообщения:', error);
            }
        }

        function addMessageToChat(messageData, isNew = true) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            
            const currentUsername = localStorage.getItem('5a_username');
            const isUser = messageData.sender === currentUsername;
            
            messageDiv.classList.add('message', isUser ? 'user-message' : 'other-message');
            
            if (!isUser && messageData.sender) {
                const senderDiv = document.createElement('div');
                senderDiv.classList.add('message-sender');
                senderDiv.textContent = messageData.sender;
                messageDiv.appendChild(senderDiv);
            }
            
            if (messageData.text) {
                const textDiv = document.createElement('div');
                textDiv.textContent = messageData.text;
                messageDiv.appendChild(textDiv);
            }
            
            if (messageData.media) {
                const mediaDiv = document.createElement('div');
                if (messageData.media.type.startsWith('image')) {
                    const img = document.createElement('img');
                    img.src = messageData.media.data;
                    img.classList.add('media-content');
                    img.onclick = () => showFullscreen(messageData.media.data, 'image');
                    mediaDiv.appendChild(img);
                } else if (messageData.media.type.startsWith('video')) {
                    const video = document.createElement('video');
                    video.src = messageData.media.data;
                    video.classList.add('media-content');
                    video.controls = true;
                    video.onclick = () => showFullscreen(messageData.media.data, 'video');
                    mediaDiv.appendChild(video);
                }
                messageDiv.appendChild(mediaDiv);
            }
            
            const timeDiv = document.createElement('div');
            timeDiv.classList.add('message-time');
            timeDiv.textContent = messageData.timestamp || new Date().toLocaleTimeString();
            messageDiv.appendChild(timeDiv);
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            if (isNew) {
                saveMessage(messageData);
            }
        }

        function sendMessage() {
            const messageInput = document.getElementById('message-input');
            const message = messageInput.value.trim();
            
            if (message) {
                const messageData = {
                    text: message,
                    sender: localStorage.getItem('5a_username'),
                    timestamp: new Date().toLocaleTimeString()
                };
                
                addMessageToChat(messageData, true);
                messageInput.value = '';
            }
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) {
                alert('Пожалуйста, выберите изображение или видео');
                return;
            }
            
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const messageData = {
                    text: '',
                    sender: localStorage.getItem('5a_username'),
                    timestamp: new Date().toLocaleTimeString(),
                    media: {
                        type: file.type,
                        data: e.target.result,
                        name: file.name
                    }
                };
                
                addMessageToChat(messageData, true);
            };
            
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function showFullscreen(src, type) {
            const fullscreen = document.getElementById('media-fullscreen');
            fullscreen.innerHTML = '<button class="close-fullscreen" onclick="closeFullscreen()">×</button>';
            
            let mediaElement;
            if (type === 'image') {
                mediaElement = document.createElement('img');
                mediaElement.src = src;
            } else {
                mediaElement = document.createElement('video');
                mediaElement.src = src;
                mediaElement.controls = true;
                mediaElement.autoplay = true;
            }
            
            fullscreen.appendChild(mediaElement);
            fullscreen.style.display = 'flex';
        }

        function closeFullscreen() {
            document.getElementById('media-fullscreen').style.display = 'none';
        }
    </script>
</body>
</html>
